name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  IS_PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build WPS frontend
        working-directory: frontend/wps_word_plugin
        run: |
          pnpm install
          pnpm build

      - name: Build MS Office frontend
        working-directory: frontend/microsoft_word_plugin
        run: |
          pnpm install
          pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          uv sync
          uv pip install pyinstaller pyside6

      - name: Build app directory with PyInstaller
        working-directory: backend
        run: |
          mkdir -p config
          echo '{}' > config/config.json
          echo '{}' > config/user_settings.json
          uv run pyinstaller ../packaging/pyinstaller/package.spec --clean --noconfirm

      - name: Create full zip
        working-directory: backend
        run: |
          mkdir -p package
          chmod +x dist/wence_ai/wence_ai
          cd dist
          zip -r ../package/wence_ai-linux-x86_64-full.zip wence_ai

      - name: Setup Ruby for fpm
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fpm
        run: gem install --no-document fpm

      - name: Build deb with fpm
        run: bash packaging/linux/build-deb.sh

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordagent-linux-packages
          path: |
            backend/package/wence_ai-linux-x86_64.deb
            backend/package/wence_ai-linux-x86_64-full.zip

      - name: Extract changelog for current tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"

          awk -v version="$RELEASE_TAG" '
            function normalize_heading(line) {
              gsub(/\r/, "", line)
              sub(/^##[[:space:]]+/, "", line)
              sub(/[[:space:]]+-[[:space:]].*$/, "", line)
              gsub(/^\[/, "", line)
              gsub(/\]$/, "", line)
              return line
            }
            /^##[[:space:]]+/ {
              if (flag) {
                exit
              }
              if (normalize_heading($0) == version) {
                flag = 1
                next
              }
            }
            flag
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No changelog found for ${RELEASE_TAG}" > release_notes.md
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/package/wence_ai-linux-x86_64.deb
            backend/package/wence_ai-linux-x86_64-full.zip
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup_prereleases:
    name: Remove matching pre-releases
    runs-on: ubuntu-22.04
    needs: [build-linux, build-macos, build-windows]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}

    permissions:
      contents: write

    steps:
      - name: Delete pre-release tags and releases for stable version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Removing pre-release tags and releases matching ${RELEASE_TAG}-*"

          while IFS= read -r prerelease_tag; do
            [ -z "${prerelease_tag}" ] && continue
            case "${prerelease_tag}" in
              "${RELEASE_TAG}"-*)
                release_id="$(gh api "repos/${REPOSITORY}/releases/tags/${prerelease_tag}" --jq '.id' 2>/dev/null || true)"
                if [ -n "${release_id}" ]; then
                  echo "Deleting release ${prerelease_tag} (${release_id})"
                  gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}"
                fi
                ;;
            esac
          done < <(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')

          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            prerelease_tag="${ref#refs/tags/}"
            case "${prerelease_tag}" in
              "${RELEASE_TAG}"-*)
                echo "Deleting git tag ${prerelease_tag}"
                gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${prerelease_tag}"
                ;;
            esac
          done < <(gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}-" --jq '.[].ref' 2>/dev/null || true)

  build-macos:
    name: Build macOS packages
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build WPS frontend
        working-directory: frontend/wps_word_plugin
        run: |
          pnpm install
          pnpm build

      - name: Build MS Office frontend
        working-directory: frontend/microsoft_word_plugin
        run: |
          pnpm install
          pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          uv sync
          uv pip install pyinstaller pyside6

      - name: Build app directory with PyInstaller
        working-directory: backend
        run: |
          mkdir -p config
          echo '{}' > config/config.json
          echo '{}' > config/user_settings.json
          uv run pyinstaller ../packaging/pyinstaller/package.spec --clean --noconfirm

      - name: Create macOS packages
        run: bash packaging/darwin/build-packages.sh

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordagent-macos-packages
          path: |
            backend/package/wence_ai-macos-arm64.dmg
            backend/package/wence_ai-macos-arm64-app.zip

      - name: Extract changelog for current tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"

          awk -v version="$RELEASE_TAG" '
            function normalize_heading(line) {
              gsub(/\r/, "", line)
              sub(/^##[[:space:]]+/, "", line)
              sub(/[[:space:]]+-[[:space:]].*$/, "", line)
              gsub(/^\[/, "", line)
              gsub(/\]$/, "", line)
              return line
            }
            /^##[[:space:]]+/ {
              if (flag) {
                exit
              }
              if (normalize_heading($0) == version) {
                flag = 1
                next
              }
            }
            flag
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No changelog found for ${RELEASE_TAG}" > release_notes.md
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/package/wence_ai-macos-arm64.dmg
            backend/package/wence_ai-macos-arm64-app.zip
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build WPS frontend
        working-directory: frontend/wps_word_plugin
        run: |
          pnpm install
          pnpm build

      - name: Build MS Office frontend
        working-directory: frontend/microsoft_word_plugin
        run: |
          pnpm install
          pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        working-directory: backend
        run: |
          uv sync
          uv pip install pyinstaller pyside6

      - name: Build app directory with PyInstaller
        working-directory: backend
        run: |
          New-Item -ItemType Directory -Force -Path config
          '{}' | Out-File -Encoding utf8 config/config.json
          '{}' | Out-File -Encoding utf8 config/user_settings.json
          uv run pyinstaller ..\packaging\pyinstaller\package.spec --clean --noconfirm

      - name: Create full zip
        working-directory: backend
        run: |
          New-Item -ItemType Directory -Force -Path package
          Compress-Archive -Path dist\wence_ai -DestinationPath package\wence_ai-windows-x86_64-full.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer with Inno Setup
        run: .\packaging\windows\build-installer.ps1

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordagent-windows-packages
          path: |
            backend/package/wence_ai-windows-x86_64-installer.exe
            backend/package/wence_ai-windows-x86_64-full.zip

      - name: Extract changelog for current tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"

          awk -v version="$RELEASE_TAG" '
            function normalize_heading(line) {
              gsub(/\r/, "", line)
              sub(/^##[[:space:]]+/, "", line)
              sub(/[[:space:]]+-[[:space:]].*$/, "", line)
              gsub(/^\[/, "", line)
              gsub(/\]$/, "", line)
              return line
            }
            /^##[[:space:]]+/ {
              if (flag) {
                exit
              }
              if (normalize_heading($0) == version) {
                flag = 1
                next
              }
            }
            flag
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No changelog found for ${RELEASE_TAG}" > release_notes.md
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/package/wence_ai-windows-x86_64-installer.exe
            backend/package/wence_ai-windows-x86_64-full.zip
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
